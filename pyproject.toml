[project]
name = "mechanics"
version = "0.1.0"
description = "Aeroelastic analysis of laminated honeycomb plates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "sympy",
    "pyyaml",
    "torch>=2.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
